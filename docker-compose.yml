services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PIEGGI_SUPABASE_URL: ${PIEGGI_SUPABASE_URL:-}
      PIEGGI_DATABASE_URL: ${PIEGGI_DATABASE_URL:-}
      PIEGGI_CHAVE_CIFRAGEM_DADOS: ${PIEGGI_CHAVE_CIFRAGEM_DADOS:-}
      PIEGGI_SUPABASE_PUBLISHABLE_KEY: ${PIEGGI_SUPABASE_PUBLISHABLE_KEY:-}
      PIEGGI_SUPABASE_SERVICE_ROLE_KEY: ${PIEGGI_SUPABASE_SERVICE_ROLE_KEY:-}
      PIEGGI_ALLOWED_ORIGINS: ${PIEGGI_ALLOWED_ORIGINS:-http://localhost:8080}
      PIEGGI_SERVICO_FISCAL_URL: ${PIEGGI_SERVICO_FISCAL_URL:-http://servico-fiscal:8081}
      PIEGGI_SERVICO_FISCAL_TOKEN: ${PIEGGI_SERVICO_FISCAL_TOKEN:-}
      PIEGGI_ARMAZENAMENTO_FISCAL_DIR: /var/lib/pieggi/fiscal
      PIEGGI_CHAVE_CIFRAGEM_FISCAL: ${PIEGGI_CHAVE_CIFRAGEM_FISCAL:-}
      PIEGGI_PERMITIR_PRODUCAO_FISCAL: ${PIEGGI_PERMITIR_PRODUCAO_FISCAL:-NAO}
    volumes:
      - ./storage/fiscal:/var/lib/pieggi/fiscal
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "${PIEGGI_APP_PORT:-8080}:80"
    restart: unless-stopped

  servico-fiscal:
    build:
      context: ./servico-fiscal
    environment:
      SERVICO_FISCAL_TOKEN: ${PIEGGI_SERVICO_FISCAL_TOKEN:-}
    volumes:
      - ./storage/fiscal:/var/lib/pieggi/fiscal
    restart: unless-stopped

